name: Wick PR cost

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  wick-report:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dogfooding: consume the locally built action from this very repo.
      - uses: ./

  # After a squash or rebase merge the commits on the base branch are new
  # objects the hooks never saw — remap the stamps onto them.
  wick-reconcile:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # push refs/notes/wick
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - uses: ./
        with:
          mode: reconcile
