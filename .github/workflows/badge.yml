name: Wick cost badge

# Regenerate the cost badge whenever main changes, and after the "Wick PR
# cost" reconcile job has remapped stamps onto a squash/rebase merge (that
# note push lands after the merge's own push event).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Wick PR cost"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write # push the wick-badge branch

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build wick
        run: |
          npm ci
          npm run build

      - name: Fetch wick notes
        run: git fetch origin '+refs/notes/wick:refs/notes/wick' || echo "no wick notes on origin yet"

      - name: Generate badge
        run: |
          # SVG for the README (served authenticated, so it works on private
          # repos); endpoint JSON alongside for shields.io on public repos.
          node dist/cli.js badge --svg HEAD > /tmp/wick-badge.svg
          node dist/cli.js badge HEAD > /tmp/wick-badge.json
          cat /tmp/wick-badge.json

      - name: Publish to wick-badge branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan wick-badge
          git rm -rf --quiet .
          cp /tmp/wick-badge.svg wick-badge.svg
          cp /tmp/wick-badge.json wick-badge.json
          git add wick-badge.svg wick-badge.json
          git commit -m "chore: update wick cost badge"
          git push --force origin wick-badge
