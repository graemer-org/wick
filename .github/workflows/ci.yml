name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One PR's pushes supersede each other; don't waste runners on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # prepare.mjs auto-installs the git hooks locally but no-ops in CI.
      - run: npm ci

      - run: npm run build

      - run: npm test
