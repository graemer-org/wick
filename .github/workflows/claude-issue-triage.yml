name: Claude Issue Triage

# Triage every newly opened issue: categorize + label it, verify the report
# against the codebase, and post a concrete implementation/investigation plan
# as a comment. Read-only on the repo; only writes to the issue.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

# Serialize triage per issue so a burst of edits/reopens can't stack runs.
concurrency:
  group: claude-issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Triage the issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Issues can be filed by users without write access.
          allowed_non_write_users: "*"
          # Create the tracking comment up front so Claude has a comment to post
          # its result into via mcp__github_comment__update_claude_comment.
          # Automation mode (prompt provided) does NOT create one by default, and
          # posting the triage write-up through `gh issue comment` fails: the body
          # is multi-line and contains backticks (`path:line`), which trips Claude
          # Code's shell-injection guard and gets the command denied.
          track_progress: true
          prompt: |
            You are triaging a newly opened issue in ${{ github.repository }}.
            ISSUE_NUMBER: ${{ github.event.issue.number }}

            Wick is a TypeScript ESM CLI that stamps AI token cost deltas onto git
            commits as notes and aggregates them per PR. Read CLAUDE.md first for
            architecture and the hard invariants.

            Do these three steps, then post ONE comment with the result:

            1. TRIAGE — Categorize the issue (bug / feature / question / docs /
               invalid). Apply the label(s) with the `mcp__github__update_issue`
               tool (owner/repo from ${{ github.repository }}, issue_number
               ISSUE_NUMBER). Use the repo's standard labels — bug, enhancement,
               documentation, question, invalid — do not invent new ones. Its
               `labels` array REPLACES the issue's current set, so include any
               already-applied label you want to keep (they're listed in the issue
               context above). Keep labels minimal and honest. This runs off the
               GitHub API via MCP, not the shell, so it works even though this job
               sandboxes Bash for untrusted issue content.

            2. VERIFY — Investigate the codebase by reading it (Read/Grep/Glob) to
               confirm the report. For a bug: locate the relevant code and judge from
               it whether the issue is valid, already fixed, expected behavior, or
               needs more info — cite files as `path:line`. Do NOT build or execute
               the project: this job runs on issues from untrusted reporters, so it
               has no code-execution tools by design. For a feature: assess
               feasibility and how it fits the existing architecture and invariants.

            3. PLAN — Write a concrete, file-referenced plan (the specific files and
               functions to change, invariants to respect, tests to add). If the
               issue is invalid or needs info, say what's missing instead.

            Post the write-up by updating the tracking comment with
            `mcp__github_comment__update_claude_comment` (NOT `gh issue comment`).
            Be concise and specific; do not edit code or open a PR — this is triage
            only.
          # No Bash here at all. Issues come from untrusted reporters, so
          # `allowed_non_write_users: "*"` puts claude-code-action into
          # subprocess-isolation mode (bubblewrap), which breaks EVERY Bash call —
          # the sandbox can't write its own .mcp.json, so `gh issue edit`/`gh label`
          # silently no-op'd and labels never got applied (issue #40). Labeling
          # therefore goes through the `mcp__github__update_issue` MCP tool (the
          # bundled GitHub MCP server, auto-enabled by the mcp__github__ allow
          # entry), which runs outside the Bash sandbox — the same reason the
          # comment MCP tool already works under isolation. Analysis stays on the
          # non-Bash Read/Grep/Glob tools.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 25
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github__update_issue,Read,Grep,Glob"

      # Dogfood: triage burns tokens and makes no commit, so post its cost as a
      # comment on the issue. comment-only — never stamp. This step runs fixed
      # action code post-triage; it never executes untrusted issue content, and
      # the comment carries only token/cost numbers (no model strings).
      - name: Capture AI cost
        if: always()
        uses: ./
        with:
          mode: stamp
          comment-only: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-issue: ${{ github.event.issue.number }}
