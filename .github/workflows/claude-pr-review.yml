name: Claude PR Review

# Full 6-subagent review (code quality, performance, security, tests, UI/UX,
# documentation), built to CONVERGE rather than spiral. A `gate` job bounds
# automatic re-reviews so a burst of fix-up pushes can't drive an endless
# review→fix→review loop, and the prompt gates on severity, reads prior rounds
# so it never re-raises a resolved point, and stops when only nits remain.
# See issue #35.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write

# One review per PR at a time — cancel a superseded run when new commits land.
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Automatic review rounds per PR before the bot stands down. Push the `review`
# label to request another pass past the cap.
env:
  MAX_AUTO_ROUNDS: "3"

jobs:
  # Decide whether this event should trigger a (re-)review. Keeps the expensive
  # 6-agent job from firing on every fix-up push once a PR has had its rounds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_review: ${{ steps.decide.outputs.should_review }}
      # Commit the latest automatic review was submitted against — lets a
      # re-review scope itself to just the new commits (empty on a first review).
      since_sha: ${{ steps.decide.outputs.since_sha }}
    steps:
      - name: Decide whether to review
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          decide() { echo "should_review=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }

          # This PR's prior automatic reviews and the commit the latest one was
          # submitted against. The sha lets a re-review scope itself to just the
          # new commits (incremental); it's empty on a first review.
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            --jq '[.[] | select(.user.login | test("github-actions"))]' 2>/dev/null || echo "[]")
          ROUNDS=$(echo "$REVIEWS" | jq 'length')
          SINCE_SHA=$(echo "$REVIEWS" | jq -r '(last // {}).commit_id // ""')
          echo "since_sha=$SINCE_SHA" >> "$GITHUB_OUTPUT"

          # A `review` label is an explicit "review again" request — always honour
          # it, regardless of how many rounds the PR has already had.
          if [ "$EVENT" = "labeled" ]; then
            if [ "$LABEL" = "review" ]; then
              decide true "forced by 'review' label"
            else
              decide false "unrelated label '$LABEL' — skipping"
            fi
            exit 0
          fi

          # First look at a freshly (re)opened PR: always review.
          if [ "$EVENT" = "opened" ] || [ "$EVENT" = "reopened" ]; then
            decide true "$EVENT — first review"
            exit 0
          fi

          # A push (synchronize): review only until the per-PR round cap, so a run
          # of fix-up commits can't drive an unbounded review→fix→review loop.
          if [ "$ROUNDS" -lt "$MAX_AUTO_ROUNDS" ]; then
            decide true "synchronize — round $((ROUNDS + 1))/$MAX_AUTO_ROUNDS"
            exit 0
          fi

          decide false "synchronize — $ROUNDS automatic reviews already; paused"
          # Announce the pause once (not on every later push).
          MARKER="🤖 wick review: paused after"
          ALREADY=$(gh pr view "$PR" --repo "$REPO" --json comments \
            --jq "[.comments[] | select(.body | startswith(\"$MARKER\"))] | length")
          if [ "$ALREADY" -eq 0 ]; then
            gh pr comment "$PR" --repo "$REPO" --body \
              "${MARKER} ${MAX_AUTO_ROUNDS} automatic rounds on this PR. Add the \`review\` label to request another pass."
          fi

  review:
    needs: gate
    if: needs.gate.outputs.should_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the merge-base diff and by-author breakdown resolve.
          fetch-depth: 0

      - name: Review the PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            Review this pull request in ${{ github.repository }}.
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md first. Then read the existing review threads on this PR
            (`gh pr view ${{ github.event.pull_request.number }} --json reviews,comments`):
            this may be a re-review. Do NOT re-raise any point already made in an
            earlier round or already addressed by a later commit.

            SINCE COMMIT: ${{ needs.gate.outputs.since_sha }}

            If SINCE COMMIT above is non-empty, this is a re-review: scope it to
            just the commits added since then. Run `git diff <SINCE COMMIT>..HEAD`
            (or narrow `gh pr diff` to the files it lists) and review ONLY those
            changes — don't re-examine code that was already reviewed and is
            unchanged. If SINCE COMMIT is empty or that commit isn't reachable,
            review the full PR diff against its merge base
            (`gh pr diff ${{ github.event.pull_request.number }}`).

            Orchestrate a full review by delegating to these six specialist
            subagents (defined in .claude/agents/) with the Task tool. Run each on
            the PR's changes:

            - code-quality-reviewer        — clean code, error handling, TS idioms
            - performance-reviewer         — hot paths, IO, subprocess overhead
            - security-code-reviewer       — injection, path handling, notes-ref safety
            - test-reviewer                — coverage, AAA tests, invariant regressions
            - ui-ux-reviewer               — build & run the CLI, capture terminal
                                             output, summarize the feature's UX
            - documentation-accuracy-reviewer — README/CLAUDE.md/--help accuracy

            Then post ONE consolidated review, most important findings first.

            Severity gate — keep the signal high, don't nitpick:
            - Open an inline comment
              (mcp__github_inline_comment__create_inline_comment) ONLY for
              correctness, security, data-loss, or CLAUDE.md-invariant violations.
            - Do NOT open inline comments for style, naming, wording, or
              doc-phrasing nits. Collect any such nits into a single optional
              "Nitpicks (non-blocking)" list in the summary, or omit it entirely.
            - If the changes since your last review have no blocking issues, post a
              one-line "No blocking issues" verdict and stop. Do not pad each lens
              or manufacture findings to fill one.

            Put the overall verdict and the UI/UX section (embed the captured
            terminal output and the feature summary) in the top-level summary
            comment. Do not modify code or push commits — review only.
          # Six subagents + synthesis in one run is turn-hungry; give headroom so
          # the review isn't cut off mid-synthesis (a 40-turn cap tripped at ~41).
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm:*),Bash(node:*),Bash(git:*),Read,Grep,Glob"

      # Dogfood: the review itself burns tokens and makes no commit, so post its
      # cost as a comment on the PR. comment-only — never stamp (the review
      # action moves HEAD, so commit-detection would misfire).
      - name: Capture AI cost
        if: always()
        uses: ./
        with:
          mode: stamp
          comment-only: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-issue: ${{ github.event.pull_request.number }}
