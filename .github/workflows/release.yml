name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Maintains a release PR from conventional commits (feat → minor,
      # fix → patch, feat! / BREAKING CHANGE → major). Merging that PR
      # creates the tag and the GitHub release with generated notes.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Attach the packed npm tarball to the release so
  # `npm install -g <tarball-url>` works without a registry.
  upload-tarball:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build and pack
        run: |
          npm ci
          npm run build
          npm pack
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" wickhq-wick-*.tgz --clobber

  # Publish @wickhq/wick via npm trusted publishing (OIDC) — no token secret.
  # Prereqs (one-time, manual): first publish from a maintainer machine, then
  # configure the trusted publisher on npmjs.com (package Settings → Trusted
  # Publisher: GitHub Actions, graemer-org/wick, workflow release.yml).
  # Until the package exists on npm this job skips gracefully.
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC exchange for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; node 22 still bundles npm 10.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publishing)
        run: |
          PKG="$(node -p 'require("./package.json").name')"
          if ! npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG does not exist on npm yet — first publish is manual (see comment above); skipping"
            exit 0
          fi
          npm ci
          npm run build
          npm publish
