name: Claude Assistant

# Baseline @claude responder: mention "@claude" in an issue, an issue comment,
# or a PR review comment and Claude will pick up the context and respond. Only
# fires when the trigger phrase is present, so idle cost is near zero.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

# This responder has contents: write and can push commits, so restrict it to
# trusted actors — only run when the @claude mention comes from a repo
# owner/member/collaborator. Untrusted users' mentions are ignored.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Record the sha the agent will start from, so the stamp step can tell a
      # run that produced a commit (stamp it) from one that only answered
      # (comment the cost) via HEAD == base-sha.
      #
      # For a PR mention this must be the PR HEAD, NOT the checkout HEAD: on
      # issue_comment / pull_request_review_comment events actions/checkout lands
      # on the default branch, but claude-code-action then checks out the PR head
      # — so a checkout-HEAD base-sha never equals the stamp step's HEAD and the
      # run is always mis-read as "committed" (no comment, and it stamps the
      # pre-existing PR head). Reading the PR head sha up front keeps them aligned.
      - name: Record base commit
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # issue_comment carries .issue.pull_request only when the issue is a PR.
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = "true" ]; then
            sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          else
            # Plain issue mention: no PR head, and claude-code-action stays on the
            # checked-out default branch, so the checkout HEAD is the right base.
            sha=$(git rev-parse HEAD)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5

      # Capture this run's AI cost: stamp + push notes if the agent committed,
      # otherwise post the cost as a comment on the triggering issue/PR.
      - name: Capture AI cost
        if: always()
        uses: ./
        with:
          mode: stamp
          base-sha: ${{ steps.base.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-issue: ${{ github.event.issue.number || github.event.pull_request.number }}
