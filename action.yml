name: "Wick PR cost report"
description: "Wick AI cost in CI: post a PR's sticky cost comment (report), remap stamps after a squash/rebase merge (reconcile), or capture an agent run's cost (stamp)."
inputs:
  github-token:
    description: "Token used to post the PR comment"
    required: false
    default: ${{ github.token }}
  mode:
    description: "'report' posts the sticky PR cost comment; 'reconcile' remaps stamps after a squash/rebase merge (run on pull_request closed+merged); 'stamp' captures a CI run's cost — stamps + pushes notes when the run made a commit, else posts an informational cost comment"
    required: false
    default: "report"
  base-sha:
    description: "'stamp' mode: HEAD before the agent ran. Required for stamp — it's how the run tells a fresh commit (stamp it) from a question-only run (comment the cost). Omitting it skips capture entirely (a blind stamp could double-count on re-runs)."
    required: false
    default: ""
  comment-issue:
    description: "'stamp' mode: issue/PR number to post the cost comment on when the run made no commit; omit to only log the cost"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Build wick
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Fetch wick notes
      shell: bash
      run: |
        git fetch origin '+refs/notes/wick:refs/notes/wick' || echo "no wick notes on origin yet"

    - name: Reconcile squash/rebase merge
      if: ${{ inputs.mode == 'reconcile' }}
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        set -euo pipefail
        WICK="node ${{ github.action_path }}/dist/cli.js"
        # git notes needs a committer identity; runners have none.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # PR head commits survive branch deletion via refs/pull/<n>/head.
        git fetch origin "+refs/pull/${PR_NUMBER}/head:refs/wick/pr-head"
        git fetch origin "$BASE_REF"
        BASE=$(git merge-base "origin/${BASE_REF}" refs/wick/pr-head)

        NPARENTS=$(git cat-file -p "$MERGE_SHA" | grep -c '^parent ' || true)
        if [ "$NPARENTS" -gt 1 ]; then
          echo "merge commit — stamps are already reachable, nothing to reconcile"
          exit 0
        fi

        mapfile -t PR_SHAS < <(git rev-list --reverse "$BASE..refs/wick/pr-head")
        mapfile -t MAIN_SHAS < <(git rev-list --reverse "$BASE..$MERGE_SHA")
        echo "PR commits: ${#PR_SHAS[@]}, new commits on ${BASE_REF}: ${#MAIN_SHAS[@]}"

        if [ "${#MAIN_SHAS[@]}" -eq 1 ]; then
          # Squash merge: union of all PR stamps onto the squash commit.
          $WICK reconcile --onto "$MERGE_SHA" "$BASE..refs/wick/pr-head"
        elif [ "${#MAIN_SHAS[@]}" -eq "${#PR_SHAS[@]}" ]; then
          # Rebase merge: 1:1 old→new mapping, same order.
          PAIRS=""
          for i in "${!PR_SHAS[@]}"; do
            PAIRS="${PAIRS}${PR_SHAS[$i]} ${MAIN_SHAS[$i]}"$'\n'
          done
          $WICK hook post-rewrite --pairs "$PAIRS"
        else
          echo "unrecognized merge shape — skipping"
          exit 0
        fi

        git push origin refs/notes/wick

    - name: Stamp AI cost (or comment when no commit)
      if: ${{ inputs.mode == 'stamp' }}
      shell: bash
      # Best-effort telemetry: a transient gh/cost hiccup must not redden the
      # whole run (the stamp/push path itself already exits 0 by design).
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE_SHA: ${{ inputs.base-sha }}
        COMMENT_ISSUE: ${{ inputs.comment-issue }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        WICK="node ${{ github.action_path }}/dist/cli.js"

        # base-sha is how we tell a fresh commit from a question-only run.
        # Without it we can't decide, and a blind stamp would double-count the
        # same tokens onto HEAD on a re-run — so skip rather than guess.
        if [ -z "$BASE_SHA" ]; then
          echo "wick: stamp mode needs base-sha to detect whether the run committed — skipping capture"
          exit 0
        fi

        # git notes needs a committer identity; runners have none.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        HEAD_SHA=$(git rev-parse HEAD)

        if [ "$HEAD_SHA" = "$BASE_SHA" ]; then
          # No commit this run — there is nothing to anchor a stamp to, and
          # stamping the pre-existing HEAD would pollute a commit already
          # reported in its own PR range. Surface the run's cost as a comment.
          $WICK cost --json > /tmp/wick-cost.json
          cat /tmp/wick-cost.json
          if [ -n "$COMMENT_ISSUE" ]; then
            BODY=$(node -e '
              const s = JSON.parse(require("fs").readFileSync("/tmp/wick-cost.json", "utf8"));
              const t = s.totalTokens;
              const tok = t >= 1e6 ? (t / 1e6).toFixed(1) + "M" : t >= 1e3 ? (t / 1e3).toFixed(1) + "k" : String(t);
              const cost = s.costUsd === null ? "n/a" : "$" + s.costUsd.toFixed(2);
              process.stdout.write(`🤖 wick: this @claude run used ${tok} tokens ≈ ${cost} (no commit produced).`);
            ')
            gh issue comment "$COMMENT_ISSUE" --repo "$REPO" --body "$BODY"
          else
            echo "no comment-issue provided — cost logged only"
          fi
          exit 0
        fi

        # A commit landed this run — stamp it from the runner's Claude Code
        # transcripts (delta vs the empty CI state = the whole run) and push the
        # notes ref via the safe fetch→merge→force-with-lease path (never a bare
        # push). Both calls exit 0 by design; a missing transcript is a no-op.
        $WICK hook post-commit --commit "$HEAD_SHA"
        $WICK hook pre-push --remote origin

    - name: Generate report
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        git fetch origin "$BASE_REF" --depth=200 || true
        RANGE="origin/${BASE_REF}..HEAD"
        # --no-fetch: notes were already fetched explicitly above.
        node "${{ github.action_path }}/dist/cli.js" report --json --no-fetch "$RANGE" > /tmp/wick-report.json
        cat /tmp/wick-report.json

    - name: Upsert sticky PR comment
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        node "${{ github.action_path }}/scripts/pr-comment.mjs" /tmp/wick-report.json

    # Budgets inform, they never block: an over-budget PR can't get cheaper,
    # so failing the check would dead-end the PR (you could keep committing
    # but never merge). Over budget → a workflow warning annotation instead.
    - name: Budget annotation
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      run: |
        node -e '
          const b = JSON.parse(require("fs").readFileSync("/tmp/wick-report.json", "utf8")).budget;
          if (!b) process.exit(0);
          const used = b.usedUsd === null ? "n/a" : `$${b.usedUsd.toFixed(2)}`;
          const line = `${used} of $${b.limitUsd.toFixed(2)} (${b.status})`;
          if (b.status === "over") console.log(`::warning title=Wick budget::PR is over budget — ${line}`);
          else if (b.status === "warn") console.log(`::notice title=Wick budget::PR is approaching its budget — ${line}`);
          else console.log(`wick budget: ${line}`);
        '
