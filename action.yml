name: "Wick PR cost report"
description: "Posts the AI token cost of a Pull Request as a sticky PR comment, computed from wick git notes."
inputs:
  github-token:
    description: "Token used to post the PR comment"
    required: false
    default: ${{ github.token }}
  mode:
    description: "'report' posts the sticky PR cost comment; 'reconcile' remaps stamps after a squash/rebase merge (run on pull_request closed+merged)"
    required: false
    default: "report"
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Build wick
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Fetch wick notes
      shell: bash
      run: |
        git fetch origin '+refs/notes/wick:refs/notes/wick' || echo "no wick notes on origin yet"

    - name: Reconcile squash/rebase merge
      if: ${{ inputs.mode == 'reconcile' }}
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        set -euo pipefail
        WICK="node ${{ github.action_path }}/dist/cli.js"
        # git notes needs a committer identity; runners have none.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # PR head commits survive branch deletion via refs/pull/<n>/head.
        git fetch origin "+refs/pull/${PR_NUMBER}/head:refs/wick/pr-head"
        git fetch origin "$BASE_REF"
        BASE=$(git merge-base "origin/${BASE_REF}" refs/wick/pr-head)

        NPARENTS=$(git cat-file -p "$MERGE_SHA" | grep -c '^parent ' || true)
        if [ "$NPARENTS" -gt 1 ]; then
          echo "merge commit — stamps are already reachable, nothing to reconcile"
          exit 0
        fi

        mapfile -t PR_SHAS < <(git rev-list --reverse "$BASE..refs/wick/pr-head")
        mapfile -t MAIN_SHAS < <(git rev-list --reverse "$BASE..$MERGE_SHA")
        echo "PR commits: ${#PR_SHAS[@]}, new commits on ${BASE_REF}: ${#MAIN_SHAS[@]}"

        if [ "${#MAIN_SHAS[@]}" -eq 1 ]; then
          # Squash merge: union of all PR stamps onto the squash commit.
          $WICK reconcile --onto "$MERGE_SHA" "$BASE..refs/wick/pr-head"
        elif [ "${#MAIN_SHAS[@]}" -eq "${#PR_SHAS[@]}" ]; then
          # Rebase merge: 1:1 old→new mapping, same order.
          PAIRS=""
          for i in "${!PR_SHAS[@]}"; do
            PAIRS="${PAIRS}${PR_SHAS[$i]} ${MAIN_SHAS[$i]}"$'\n'
          done
          $WICK hook post-rewrite --pairs "$PAIRS"
        else
          echo "unrecognized merge shape — skipping"
          exit 0
        fi

        git push origin refs/notes/wick

    - name: Generate report
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        git fetch origin "$BASE_REF" --depth=200 || true
        RANGE="origin/${BASE_REF}..HEAD"
        node "${{ github.action_path }}/dist/cli.js" report --json "$RANGE" > /tmp/wick-report.json
        cat /tmp/wick-report.json

    - name: Upsert sticky PR comment
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        node "${{ github.action_path }}/scripts/pr-comment.mjs" /tmp/wick-report.json

    # Budgets inform, they never block: an over-budget PR can't get cheaper,
    # so failing the check would dead-end the PR (you could keep committing
    # but never merge). Over budget → a workflow warning annotation instead.
    - name: Budget annotation
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      run: |
        node -e '
          const b = JSON.parse(require("fs").readFileSync("/tmp/wick-report.json", "utf8")).budget;
          if (!b) process.exit(0);
          const used = b.usedUsd === null ? "n/a" : `$${b.usedUsd.toFixed(2)}`;
          const line = `${used} of $${b.limitUsd.toFixed(2)} (${b.status})`;
          if (b.status === "over") console.log(`::warning title=Wick budget::PR is over budget — ${line}`);
          else if (b.status === "warn") console.log(`::notice title=Wick budget::PR is approaching its budget — ${line}`);
          else console.log(`wick budget: ${line}`);
        '
