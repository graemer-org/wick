name: "Wick PR cost report"
description: "Wick AI cost in CI: post a PR's sticky cost comment (report), remap stamps after a squash/rebase merge (reconcile), or capture an agent run's cost (stamp)."
inputs:
  github-token:
    description: "Token used to post the PR comment"
    required: false
    default: ${{ github.token }}
  mode:
    description: "'report' posts the sticky PR cost comment; 'reconcile' remaps stamps after a squash/rebase merge (run on pull_request closed+merged); 'stamp' captures a CI run's cost — stamps + pushes notes when the run made a commit, else logs the cost (and posts it as a comment if comment-issue is set)"
    required: false
    default: "report"
  base-sha:
    description: "'stamp' mode: HEAD before the agent ran. Required for stamp — it's how the run tells a fresh commit (stamp it) from a question-only run (comment the cost). Omitting it skips capture entirely (a blind stamp could double-count on re-runs)."
    required: false
    default: ""
  comment-issue:
    description: "'stamp' mode: issue/PR number to post the cost comment on when the run made no commit; omit to only log the cost"
    required: false
    default: ""
  comment-only:
    description: "'stamp' mode: set 'true' for workflows that never make a dev commit (PR review, issue triage) — always report the cost as a comment, never stamp. Skips HEAD detection, which is unreliable when the surrounding action moves HEAD (e.g. checks out the PR head)."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Build wick
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Fetch wick notes
      shell: bash
      run: |
        git fetch origin '+refs/notes/wick:refs/notes/wick' || echo "no wick notes on origin yet"

    - name: Reconcile squash/rebase merge
      if: ${{ inputs.mode == 'reconcile' }}
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        set -euo pipefail
        WICK="node ${{ github.action_path }}/dist/cli.js"
        # git notes needs a committer identity; runners have none.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # PR head commits survive branch deletion via refs/pull/<n>/head.
        git fetch origin "+refs/pull/${PR_NUMBER}/head:refs/wick/pr-head"
        git fetch origin "$BASE_REF"
        # Shape detection (squash vs rebase vs merge commit) and the remap live
        # in `reconcile-merge` where they're unit-tested — the base branch drifts
        # under open PRs, and the old bash counted commits in a drift-polluted
        # range, so it skipped every affected PR (#47). --remote pushes the
        # remapped notes only when a stamp actually moved, via the safe path.
        $WICK reconcile-merge \
          --merge-sha "$MERGE_SHA" \
          --base-ref "origin/${BASE_REF}" \
          --pr-head refs/wick/pr-head \
          --remote origin

    - name: Stamp AI cost (or comment when no commit)
      if: ${{ inputs.mode == 'stamp' }}
      shell: bash
      # Best-effort telemetry: a transient gh/cost hiccup must not redden the
      # whole run (the stamp/push path itself already exits 0 by design).
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE_SHA: ${{ inputs.base-sha }}
        COMMENT_ISSUE: ${{ inputs.comment-issue }}
        COMMENT_ONLY: ${{ inputs.comment-only }}
        REPO: ${{ github.repository }}
        # Label + link this run's row in the accumulating comment's per-run table.
        WICK_RUN_LABEL: run ${{ github.run_number }}
        WICK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        WICK="node ${{ github.action_path }}/dist/cli.js"

        # Report this run's cost (from the runner's transcripts) as a comment
        # styled like the sticky `wick report` comment. `wick cost`'s plain line
        # stays the log + skip-guard signal; the comment body is rendered from
        # `wick cost --json` by scripts/cost-comment.mjs (renderNoCommitComment) —
        # one shared renderer, and the untrusted model names ride the REST body,
        # never a shell argument.
        post_cost_comment() {
          COST_LINE=$($WICK cost)
          echo "$COST_LINE"
          if [ -z "$COMMENT_ISSUE" ]; then
            echo "no comment-issue provided — cost logged only"
          elif [[ "$COST_LINE" == "wick: 0 tokens "* ]]; then
            # Nothing worth a comment: 0 tokens — the agent was skipped, errored
            # immediately, or its transcript wasn't flushed (covers the 0-session
            # case too). Logging the line above is enough.
            echo "no usage found — skipping comment"
          else
            $WICK cost --json > /tmp/wick-cost.json
            node "${{ github.action_path }}/scripts/cost-comment.mjs" /tmp/wick-cost.json
          fi
        }

        # Review/triage never make a dev commit, so don't try to detect one:
        # the surrounding claude-code-action moves HEAD (it checks out the PR
        # head), which would false-trigger the "commit landed" branch. Always
        # comment the cost instead.
        if [ "$COMMENT_ONLY" = "true" ]; then
          post_cost_comment
          exit 0
        fi

        # base-sha is how we tell a fresh commit from a question-only run.
        # Without it we can't decide, and a blind stamp would double-count the
        # same tokens onto HEAD on a re-run — so skip rather than guess.
        if [ -z "$BASE_SHA" ]; then
          echo "wick: stamp mode needs base-sha to detect whether the run committed — skipping capture"
          exit 0
        fi

        # git notes needs a committer identity; runners have none.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        HEAD_SHA=$(git rev-parse HEAD)

        if [ "$HEAD_SHA" = "$BASE_SHA" ]; then
          # No commit this run — nothing to anchor a stamp to, and stamping the
          # pre-existing HEAD would pollute a commit reported in its own PR range.
          post_cost_comment
          exit 0
        fi

        # A commit landed this run — stamp it from the runner's Claude Code
        # transcripts (delta vs the empty CI state = the whole run) and push the
        # notes ref via the safe fetch→merge→force-with-lease path (never a bare
        # push). Both calls exit 0 by design; a missing transcript is a no-op.
        $WICK hook post-commit --commit "$HEAD_SHA"
        $WICK hook pre-push --remote origin

    - name: Generate report
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        git fetch origin "$BASE_REF" --depth=200 || true
        RANGE="origin/${BASE_REF}..HEAD"
        # --no-fetch: notes were already fetched explicitly above.
        node "${{ github.action_path }}/dist/cli.js" report --json --no-fetch "$RANGE" > /tmp/wick-report.json
        cat /tmp/wick-report.json

    - name: Upsert sticky PR comment
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        node "${{ github.action_path }}/scripts/pr-comment.mjs" /tmp/wick-report.json

    # Budgets inform, they never block: an over-budget PR can't get cheaper,
    # so failing the check would dead-end the PR (you could keep committing
    # but never merge). Over budget → a workflow warning annotation instead.
    - name: Budget annotation
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      run: |
        node -e '
          const b = JSON.parse(require("fs").readFileSync("/tmp/wick-report.json", "utf8")).budget;
          if (!b) process.exit(0);
          const used = b.usedUsd === null ? "n/a" : `$${b.usedUsd.toFixed(2)}`;
          const line = `${used} of $${b.limitUsd.toFixed(2)} (${b.status})`;
          if (b.status === "over") console.log(`::warning title=Wick budget::PR is over budget — ${line}`);
          else if (b.status === "warn") console.log(`::notice title=Wick budget::PR is approaching its budget — ${line}`);
          else console.log(`wick budget: ${line}`);
        '
